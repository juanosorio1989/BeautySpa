<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teléfono y código</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A2E5A}a:hover{color:#5C2143}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F5; font-family: Inter, system-ui, sans-serif; color: #1F1A17; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="Horario.dc.html" aria-label="Volver" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: #1F1A17">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Tus datos</div>
  </header>
  <div style="margin: 4px 20px 0; display: flex; align-items: center; gap: 10px; background: #FFF4E5; border-radius: 12px; padding: 12px 14px; color: #6B3D00; font-size: 14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span>Te apartamos el horario por <strong>4:32</strong></span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="phone" style="font-size: 14px; font-weight: 600">Tu celular</label>
      <div style="display: flex; gap: 8px">
        <div style="display: flex; align-items: center; padding: 0 14px; min-height: 52px; border: 1px solid #DCD2CC; border-radius: 12px; background: #FFFFFF; font-size: 16px">+1</div>
        <input id="phone" type="tel" value="(718) 555-0123" style="flex: 1; min-height: 52px; box-sizing: border-box; border: 1px solid #DCD2CC; border-radius: 12px; padding: 0 14px; font: 16px Inter, sans-serif; color: #1F1A17; background: #FFFFFF">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="code" style="font-size: 14px; font-weight: 600">Código que te enviamos por WhatsApp</label>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <div style="min-height: 52px; border: 2px solid #7A2E5A; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 20px Inter, sans-serif">4</div>
        <div style="min-height: 52px; border: 2px solid #7A2E5A; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 20px Inter, sans-serif">8</div>
        <div style="min-height: 52px; border: 2px solid #7A2E5A; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 600 20px Inter, sans-serif">1</div>
        <div style="min-height: 52px; border: 1px solid #DCD2CC; border-radius: 12px; background: #FFFFFF"></div>
        <div style="min-height: 52px; border: 1px solid #DCD2CC; border-radius: 12px; background: #FFFFFF"></div>
        <div style="min-height: 52px; border: 1px solid #DCD2CC; border-radius: 12px; background: #FFFFFF"></div>
      </div>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Código de 6 dígitos" style="position: absolute; width: 1px; height: 1px; opacity: 0">
      <button type="button" style="align-self: flex-start; border: 0; background: transparent; padding: 10px 0; min-height: 44px; font: 600 14px Inter, sans-serif; color: #7A2E5A">¿No te llegó? Enviar por SMS</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 14px; font-weight: 600">Tu nombre</label>
      <input id="name" type="text" value="María López" style="min-height: 52px; box-sizing: border-box; border: 1px solid #DCD2CC; border-radius: 12px; padding: 0 14px; font: 16px Inter, sans-serif; color: #1F1A17; background: #FFFFFF">
    </div>
  </div>
  <footer style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E6DDD7; display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.4; color: #1F1A17">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #7A2E5A">
      <span>Envíenme la confirmación y los recordatorios por <strong>WhatsApp</strong>. Puedo responder BAJA para dejar de recibirlos.</span>
    </label>
    <a href="Confirmada.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #7A2E5A; color: #FFFFFF; font: 600 16px Inter, sans-serif; text-decoration: none">Confirmar cita</a>
  </footer>
</div>
</x-dc>

return {};
}
}
</script>
</body>
</html>
